[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dossierdock"
version = "0.2.0"
description = "Deployment contracts, release evidence, and manifest generation for containerized AI and multi-agent services."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Shashank Singh" },
]
keywords = ["ai", "multi-agent", "containers", "deployment", "docker", "kubernetes", "ci-cd", "mlops", "release-evidence", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.1"]

[project.scripts]
dossierdock = "dossierdock.cli:main"

[project.urls]
Homepage = "https://github.com/shasanksingh/dossierdock"
Issues = "https://github.com/shasanksingh/dossierdock/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
